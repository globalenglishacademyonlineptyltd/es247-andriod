name: Build and publish ES 24/7 Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build installable APK
        run: gradle --no-daemon assembleDebug
      - name: Publish permanent GitHub Release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: ES 24/7 Android App (Latest)
          body: |
            Latest installable ES 24/7 Android APK.
            Download app-debug.apk below. This release asset remains available until replaced or deleted.
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true
      - name: Keep workflow artifact as backup
        uses: actions/upload-artifact@v4
        with:
          name: ES247-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
