plugins {
    id 'com.android.application'
}

android {
    namespace 'za.co.es247.client'
    compileSdk 35

    defaultConfig {
        applicationId 'za.co.es247.client'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.2.1'
    }

    signingConfigs {
        release {
            def ksFile = System.getenv('ES247_KEYSTORE_FILE')
            if (ksFile != null && !ksFile.isBlank()) {
                storeFile file(ksFile)
            }
            storePassword System.getenv('ES247_KEYSTORE_PASSWORD')
            keyAlias System.getenv('ES247_KEY_ALIAS')
            keyPassword System.getenv('ES247_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

// Download the official ES 24/7 artwork from the web repository and convert
// it to a clean Android-compatible PNG before resource compilation.
def officialLogoUrl = 'https://raw.githubusercontent.com/globalenglishacademyonlineptyltd/es247-web/main/public/ChatGPT%20Image%20Oct%2028%2C%202026%2C%2012_54_29%20PM.png'
def officialLogoFile = file('src/main/res/drawable/app_logo.png')
def officialLogoSource = file("${buildDir}/official-es247-logo-source")

tasks.register('downloadOfficialEs247Logo') {
    outputs.file(officialLogoFile)
    doLast {
        officialLogoFile.parentFile.mkdirs()
        officialLogoSource.parentFile.mkdirs()

        def connection = new URL(officialLogoUrl).openConnection()
        connection.setRequestProperty('User-Agent', 'ES247-Android-Build')
        connection.connect()
        connection.inputStream.withCloseable { input ->
            officialLogoSource.withOutputStream { output ->
                output << input
            }
        }

        if (!officialLogoSource.exists() || officialLogoSource.length() == 0) {
            throw new GradleException('Official ES 24/7 logo could not be downloaded.')
        }

        // Use ImageMagick rather than Java ImageIO so the source artwork is
        // normalized to a PNG format that AAPT can compile reliably.
        def magickCheck = ['bash', '-lc', 'command -v magick || command -v convert'].execute()
        magickCheck.waitFor()
        def magick = magickCheck.text.trim()
        if (!magick) {
            throw new GradleException('ImageMagick is not available on the GitHub Actions runner.')
        }

        def process = [
            'bash', '-lc',
            "${magick} \"${officialLogoSource.absolutePath}\" -auto-orient -resize '1024x1024>' -strip PNG32:\"${officialLogoFile.absolutePath}\""
        ].execute()
        process.consumeProcessOutput(System.out, System.err)
        def exitCode = process.waitFor()
        if (exitCode != 0 || !officialLogoFile.exists() || officialLogoFile.length() == 0) {
            throw new GradleException('Could not convert the official ES 24/7 logo to an Android-compatible PNG.')
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('downloadOfficialEs247Logo'))
}
