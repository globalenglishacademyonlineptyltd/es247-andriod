plugins {
    id 'com.android.application'
}

android {
    namespace 'za.co.es247.client'
    compileSdk 35

    defaultConfig {
        applicationId 'za.co.es247.client'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.2.1'
    }

    signingConfigs {
        release {
            def ksFile = System.getenv('ES247_KEYSTORE_FILE')
            if (ksFile != null && !ksFile.isBlank()) {
                storeFile file(ksFile)
            }
            storePassword System.getenv('ES247_KEYSTORE_PASSWORD')
            keyAlias System.getenv('ES247_KEY_ALIAS')
            keyPassword System.getenv('ES247_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

// The official ES 24/7 artwork is maintained in the web repository.
// The uploaded file has a .png filename but is actually JPEG data, so
// convert it to a real PNG before Android's resource compiler sees it.
def officialLogoUrl = 'https://raw.githubusercontent.com/globalenglishacademyonlineptyltd/es247-web/main/public/ChatGPT%20Image%20Oct%2028%2C%202026%2C%2012_54_29%20PM.png'
def officialLogoFile = file('src/main/res/drawable/app_logo.png')
def officialLogoDownload = file("${buildDir}/official-es247-logo-source")

tasks.register('downloadOfficialEs247Logo') {
    outputs.file(officialLogoFile)
    doLast {
        officialLogoFile.parentFile.mkdirs()
        officialLogoDownload.parentFile.mkdirs()

        def connection = new URL(officialLogoUrl).openConnection()
        connection.setRequestProperty('User-Agent', 'ES247-Android-Build')
        connection.connect()
        connection.inputStream.withCloseable { input ->
            officialLogoDownload.withOutputStream { output ->
                output << input
            }
        }

        if (!officialLogoDownload.exists() || officialLogoDownload.length() == 0) {
            throw new GradleException('Official ES 24/7 logo could not be downloaded.')
        }

        def image = javax.imageio.ImageIO.read(officialLogoDownload)
        if (image == null) {
            throw new GradleException('Downloaded ES 24/7 logo is not a readable image.')
        }

        def converted = new java.awt.image.BufferedImage(
            image.width,
            image.height,
            java.awt.image.BufferedImage.TYPE_INT_ARGB
        )
        def graphics = converted.createGraphics()
        try {
            graphics.drawImage(image, 0, 0, null)
        } finally {
            graphics.dispose()
        }

        if (!javax.imageio.ImageIO.write(converted, 'png', officialLogoFile)) {
            throw new GradleException('Could not convert the official ES 24/7 logo to PNG.')
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('downloadOfficialEs247Logo'))
}
